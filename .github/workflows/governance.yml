name: Governance CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

jobs:
  governance:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - run: npm ci
      
      - name: Type Safety Gate
        run: npm run governance:types
        continue-on-error: true
      
      - name: API Contract Gate (Zod)
        run: npm run governance:zod
        continue-on-error: true
      
      - name: Architecture Gate
        run: npm run governance:architecture
        continue-on-error: true
      
      - name: Security Gate
        run: npm run governance:security
        continue-on-error: true
      
      - name: Data Integrity Gate
        run: npm run governance:data
        continue-on-error: true
      
      - name: Test Coverage Gate
        run: npm run governance:coverage
        continue-on-error: true
      
      - name: Debt Scoring Engine
        run: npm run governance:debt
      
      - name: Generate Governance Report
        run: npm run governance:report
      
      - name: Upload Governance Report
        uses: actions/upload-artifact@v4
        with:
          name: governance-report
          path: reports/governance-report.json
      
      - name: Check Debt Score
        run: |
          DEBT_SCORE=$(node -e "const report = require('./reports/governance-report.json'); console.log(report.debtScore);")
          if [ $DEBT_SCORE -gt 60 ]; then
            echo "❌ Debt score $DEBT_SCORE > 60 - BLOCKING MERGE"
            exit 1
          elif [ $DEBT_SCORE -gt 30 ]; then
            echo "⚠️ Debt score $DEBT_SCORE between 30 and 60 - WARNING"
          else
            echo "✅ Debt score $DEBT_SCORE < 30 - PASS"
          fi
